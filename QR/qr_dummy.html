<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K5Shop - Pembayaran</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            color: #ff6b35;
            font-size: 2.5em;
            font-weight: bold;
        }
        .warning {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
            color: #856404;
            font-weight: bold;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #ff6b35;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #ff6b35;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover {
            background: #f7931e;
        }
        .amount {
            font-size: 2em;
            font-weight: bold;
            color: #ff6b35;
            text-align: center;
            margin: 20px 0;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #ff6b35;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="warning">
            ⚠️ HALAMAN FAKE - Hanya untuk Testing
        </div>
        <div class="logo">
            <h1>K5Shop</h1>
        </div>
        <div class="amount">Rp 150.000</div>
        <form>
            <div class="form-group">
                <label>Email / Nomor HP</label>
                <input type="text" placeholder="Masukkan Email atau Nomor HP" disabled>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Masukkan Password" disabled>
            </div>
            <button type="button" class="btn" onclick="alert('Ini adalah halaman FAKE untuk testing!')">Bayar Sekarang</button>
        </form>
        <div class="back-link">
            <a href="qr_payment_dummy.html">← Kembali ke Halaman Utama</a>
        </div>
    </div>
</body>
</html>
