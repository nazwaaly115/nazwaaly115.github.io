<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pembayaran Digital</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: white;
            padding: 25px;
            width: 320px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            color: #1a73e8;
            text-align: center;
        }
        .row {
            margin: 10px 0;
        }
        .label {
            color: #555;
            font-size: 14px;
        }
        .value {
            font-weight: bold;
        }
        .status {
            margin-top: 15px;
            padding: 10px;
            background: #e8f0fe;
            color: #1a73e8;
            text-align: center;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Pembayaran Digital</h2>

    <div class="row">
        <div class="label">Merchant</div>
        <div class="value">Toko ABC</div>
    </div>

    <div class="row">
        <div class="label">Nominal</div>
        <div class="value">Rp50.000</div>
    </div>

    <div class="row">
        <div class="label">Metode</div>
        <div class="value">QRIS</div>
    </div>

    <div class="status">
        Menunggu Konfirmasi Pembayaran
    </div>
</div>

</body>
</html>
