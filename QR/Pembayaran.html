<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran Digital</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #6ec6ff, #b3e5fc);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            border-radius: 16px;
            padding: 30px;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
        }
        h1 {
            color: #0277bd;
            margin-bottom: 25px;
        }
        .label {
            color: #555;
            font-size: 14px;
            margin-top: 15px;
        }
        .value {
            font-size: 18px;
            font-weight: bold;
            color: #222;
            margin-top: 5px;
        }
        .amount {
            font-size: 24px;
            font-weight: bold;
            color: #000000;
            margin-top: 5px;
        }
        .btn {
            margin-top: 30px;
            width: 100%;
            padding: 14px;
            background: #03a9f4;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:hover {
            background: #0288d1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Pembayaran Digital</h1>

        <div class="label">Merchant</div>
        <div class="value">K5Shop</div>

        <div class="label">Nominal</div>
        <div class="amount">RP. 50.000</div>

        <div class="label">Metode</div>
        <div class="value">QRIS</div>

        <button class="btn" onclick="alert('Pembayaran diproses (dummy)')">
            BAYAR SEKARANG
        </button>
    </div>
</body>
</html>
